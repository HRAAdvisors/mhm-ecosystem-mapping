<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="450" viewBox="0 0 1600 450" font-family="Open Sans"><rect width="1600" height="450" fill="#FFFFFF"/><text x="52" y="62" font-size="30" font-weight="700" fill="#22223B">Publishing information to the map</text><rect x="52" y="110" width="320" height="190" rx="18" fill="#FFFFFF" stroke="#D5D9DE" stroke-width="2.5"/><text x="212" y="158" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#5B6070">SOURCE</text><text x="212" y="202" text-anchor="middle" font-size="27" font-weight="700" fill="#22223B">Raw source data</text><text x="212" y="242" text-anchor="middle" font-size="20" fill="#5B6070">FCC, Census Bureau,</text><text x="212" y="270" text-anchor="middle" font-size="20" fill="#5B6070">and other sources</text><line x1="384" y1="205" x2="420" y2="205" stroke="#22223B" stroke-width="3"/><path d="M 432 205 L 416 195 L 416 215 Z" fill="#22223B"/><rect x="444" y="110" width="320" height="190" rx="18" fill="#EFFCFA" stroke="#2A9D8F" stroke-width="2.5"/><text x="604" y="158" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#2A9D8F">STEP 1</text><text x="604" y="202" text-anchor="middle" font-size="27" font-weight="700" fill="#22223B">HR&amp;A converts</text><text x="604" y="242" text-anchor="middle" font-size="20" fill="#5B6070">Raw data becomes</text><text x="604" y="270" text-anchor="middle" font-size="20" fill="#5B6070">map-ready files</text><line x1="776" y1="205" x2="812" y2="205" stroke="#22223B" stroke-width="3"/><path d="M 824 205 L 808 195 L 808 215 Z" fill="#22223B"/><rect x="836" y="110" width="320" height="190" rx="18" fill="#EFFCFA" stroke="#2A9D8F" stroke-width="2.5"/><text x="996" y="158" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#2A9D8F">STEP 2</text><text x="996" y="202" text-anchor="middle" font-size="27" font-weight="700" fill="#22223B">Amazon S3 storage</text><text x="996" y="242" text-anchor="middle" font-size="20" fill="#5B6070">Finished files are</text><text x="996" y="270" text-anchor="middle" font-size="20" fill="#5B6070">stored online (Sec. 2.3)</text><line x1="1168" y1="205" x2="1204" y2="205" stroke="#22223B" stroke-width="3"/><path d="M 1216 205 L 1200 195 L 1200 215 Z" fill="#22223B"/><rect x="1228" y="110" width="320" height="190" rx="18" fill="#EFFCFA" stroke="#2A9D8F" stroke-width="2.5"/><text x="1388" y="158" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#2A9D8F">STEP 3</text><text x="1388" y="202" text-anchor="middle" font-size="27" font-weight="700" fill="#22223B">Website displays</text><text x="1388" y="242" text-anchor="middle" font-size="20" fill="#5B6070">The map reads the</text><text x="1388" y="270" text-anchor="middle" font-size="20" fill="#5B6070">files from S3</text><path d="M 1388 314 L 1388 390 L 604 390 L 604 330" fill="none" stroke="#2A9D8F" stroke-width="2.5" stroke-dasharray="9 8"/><path d="M 604 314 L 594 330 L 614 330 Z" fill="#2A9D8F"/><rect x="656" y="368" width="680" height="44" rx="22" fill="#FFFFFF"/><text x="996" y="397" text-anchor="middle" font-size="20" font-weight="600" fill="#22223B">When the data change, HR&amp;A repeats the steps and refreshes the site</text></svg>